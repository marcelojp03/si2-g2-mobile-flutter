name: si2_g2_mobile
description: "Sistema de Gestion Academica SaaS - UAGRM SI2 Grupo 2"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # HTTP
  dio: ^5.7.0

  # Auth / Storage
  flutter_secure_storage: ^9.2.3
  jwt_decoder: ^2.0.1

  # Routing
  go_router: ^14.8.1

  # Theme
  flex_color_scheme: ^8.3.0
  dynamic_color: ^1.7.0
  google_fonts: ^6.3.1

  # Firebase (FCM notificaciones push)
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5

  # Forms
  reactive_forms: ^17.0.1

  # Text
  auto_size_text: ^3.0.0

  # Date formatting
  intl: ^0.20.2

  # Animations
  flutter_animate: ^4.5.0

  # UI feedback
  another_flushbar: ^1.12.30

  # Environment
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
